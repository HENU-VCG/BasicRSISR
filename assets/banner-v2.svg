<pattern id="tiles" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#316c60"/><rect x="2" y="2" width="8" height="5" fill="#83a282"/><path d="M0 10H20M11 0V20" stroke="#c0d8c3" stroke-width="2"/><rect x="13" y="13" width="6" height="5" fill="#557c96"/></pattern>
