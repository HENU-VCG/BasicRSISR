<g fill="#eaf8ff" font-size="15.5">
<text x="426" y="224">01   Remote sensing SR method collection</text>
<text x="426" y="253">02   CNN, Transformer, Mamba and Diffusion</text>
<text x="426" y="282">03   Unified training and evaluation guides</text>
<text x="426" y="311">04   Dataset preparation and preprocessing</text>
<text x="426" y="340">05   Reproducible benchmarks and configs</text>
<text x="919" y="224">06   Extension guides for new methods</text>
