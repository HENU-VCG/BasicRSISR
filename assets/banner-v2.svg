<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
<title id="title">BasicRSISR — planned remote sensing super-resolution toolbox</title>
<desc id="desc">Original blue space-themed vector banner with a friendly satellite, Earth, illustrative map crops, and nine planned resource areas. Homepage draft, not a software release.</desc>
